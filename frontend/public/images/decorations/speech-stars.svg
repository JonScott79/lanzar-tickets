<?xml version="1.0" encoding="UTF-8"?>
<!--
    speech-stars.svg

    LANZAR Support Tickets speech bubble decoration.

    Responsibilities

    - Provide Atomic Age decorative starbursts
    - Add visual emphasis to Stella's dialogue
    - Remain independent from the speech bubble layout
    - Scale cleanly at any interface size
-->

