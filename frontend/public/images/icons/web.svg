<?xml version="1.0" encoding="UTF-8"?>
<!--
    web.svg

    LANZAR Support Tickets WEB service icon.

    Responsibilities

    - Represent LANZAR web services
    - Provide a reusable Atomic Age globe icon
    - Scale cleanly at any interface size
-->

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    fill="none"
    role="img"
    aria-labelledby="webIconTitle"
>
    <title id="webIconTitle">Web Services</title>

    <!-- Globe -->
    <circle
        cx="32"
        cy="32"
        r="25"
        stroke="currentColor"
        stroke-width="3"
    />

    <!-- Longitude -->
    <path
        d="M32 7
           C22 14 18 22 18 32
           C18 42 22 50 32 57"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
    />

    <path
        d="M32 7
           C42 14 46 22 46 32
           C46 42 42 50 32 57"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
    />

    <!-- Latitude -->
    <path
        d="M8 25
           C15 29 23 31 32 31
           C41 31 49 29 56 25"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
    />

    <path
        d="M8 39
           C15 35 23 33 32 33
           C41 33 49 35 56 39"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
    />

    <!-- Equator -->
    <path
        d="M7 32
           H57"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
    />
</svg>