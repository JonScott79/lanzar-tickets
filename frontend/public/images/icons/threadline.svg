<?xml version="1.0" encoding="UTF-8"?>
<!--
    threadline.svg

    LANZAR Support Tickets THREADLINE service icon.

    Responsibilities

    - Represent Threadline services
    - Provide a connected-node communication icon
    - Scale cleanly at any interface size
-->

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    fill="none"
    role="img"
    aria-labelledby="threadlineIconTitle"
>
    <title id="threadlineIconTitle">Threadline</title>

    <!-- Connection Lines -->
    <path
        d="M20 20 L44 18"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M20 20 L15 45"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M44 18 L50 43"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M15 45 L50 43"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M20 20 L32 32"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M44 18 L32 32"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M15 45 L32 32"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <path
        d="M50 43 L32 32"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <!-- Nodes -->
    <circle
        cx="20"
        cy="20"
        r="7"
        fill="var(--bg-secondary)"
        stroke="currentColor"
        stroke-width="3"
    />

    <circle
        cx="44"
        cy="18"
        r="7"
        fill="var(--bg-secondary)"
        stroke="currentColor"
        stroke-width="3"
    />

    <circle
        cx="15"
        cy="45"
        r="7"
        fill="var(--bg-secondary)"
        stroke="currentColor"
        stroke-width="3"
    />

    <circle
        cx="50"
        cy="43"
        r="7"
        fill="var(--bg-secondary)"
        stroke="currentColor"
        stroke-width="3"
    />

    <circle
        cx="32"
        cy="32"
        r="8"
        fill="var(--bg-secondary)"
        stroke="currentColor"
        stroke-width="3"
    />
</svg>