<?xml version="1.0" encoding="UTF-8"?>
<!--
    it.svg

    LANZAR Support Tickets IT service icon.

    Responsibilities

    - Represent LANZAR IT services
    - Provide a simple retro terminal/computer icon
    - Scale cleanly at any interface size
-->

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    fill="none"
    role="img"
    aria-labelledby="itIconTitle"
>
    <title id="itIconTitle">IT Support</title>

    <!-- Monitor -->
    <rect
        x="9"
        y="9"
        width="46"
        height="34"
        rx="3"
        stroke="currentColor"
        stroke-width="3"
    />

    <!-- Screen -->
    <rect
        x="15"
        y="15"
        width="34"
        height="22"
        rx="1"
        stroke="currentColor"
        stroke-width="2"
    />

    <!-- Monitor Stand -->
    <path
        d="M32 43 V51"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <!-- Monitor Base -->
    <path
        d="M20 54 H44"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
    />

    <!-- Retro Screen Detail -->
    <circle
        cx="20"
        cy="21"
        r="2"
        fill="currentColor"
    />

    <path
        d="M25 21 H42"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
    />
</svg>