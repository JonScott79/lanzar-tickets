<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Deep Navy Background -->
    <rect width="64" height="64" rx="16" fill="#102A43" />
    
    <!-- Cyan Orbit -->
    <ellipse cx="32" cy="32" rx="22" ry="22" fill="none" stroke="#2A728F" stroke-width="2" />
    
    <!-- Destination Planet (Rocket Orange) -->
    <circle cx="50" cy="18" r="5" fill="#F46B45" />
    
    <!-- North Star (Gold) -->
    <g transform="translate(32 32) scale(1.5)">
        <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#E2B84D" />
    </g>
</svg>
